name: Robinhood Sniper

# Stateless cron trader. Each run reads live account state, makes one
# decision, and exits. See cron_trader.py for the strategy.
#
# Cron is in UTC. The window below (13:00-21:00 UTC, Mon-Fri) covers US
# market hours under both EDT (13:30-20:00) and EST (14:30-21:00); the
# script itself gates on the real Eastern-time session, so off-hours runs
# are cheap no-ops.
#
# NOTE: GitHub-hosted scheduled workflows fire on a best-effort basis and
# can be delayed several minutes under load. For tighter timing, move to a
# VPS + systemd timer running the same cron_trader.py.

on:
  schedule:
    - cron: "*/5 13-20 * * 1-5"   # every 5 min during market hours
  workflow_dispatch:               # manual "Run workflow" button

# Never let two runs trade at once.
concurrency:
  group: robinhood-sniper
  cancel-in-progress: false

jobs:
  trade:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install deps
        run: pip install requests pytz yfinance

      - name: Run sniper
        env:
          MCP_BEARER_TOKEN:       ${{ secrets.MCP_BEARER_TOKEN }}
          AGENTIC_ACCOUNT:        ${{ secrets.AGENTIC_ACCOUNT }}
          # Strategy knobs (override via repo Variables; safe defaults here)
          SNIPER_SYMBOL:          ${{ vars.SNIPER_SYMBOL || 'APLD' }}
          SNIPER_CAPITAL:         ${{ vars.SNIPER_CAPITAL || '5.00' }}
          SNIPER_TARGET_PCT:      ${{ vars.SNIPER_TARGET_PCT || '0.25' }}
          SNIPER_HARD_STOP:       ${{ vars.SNIPER_HARD_STOP || '0' }}
          SNIPER_TRAIL_ACTIVE:    ${{ vars.SNIPER_TRAIL_ACTIVE || '0.08' }}
          SNIPER_TRAIL_STEP:      ${{ vars.SNIPER_TRAIL_STEP || '0.03' }}
          SNIPER_ENTRY_ENABLED:   ${{ vars.SNIPER_ENTRY_ENABLED || 'false' }}
          SNIPER_ENTRY_START:     ${{ vars.SNIPER_ENTRY_START || '09:30' }}
          SNIPER_ENTRY_END:       ${{ vars.SNIPER_ENTRY_END || '10:30' }}
        run: python cron_trader.py
